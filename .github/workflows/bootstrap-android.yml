name: Bootstrap and verify Android project

on:
  push:
    branches: [ apk-build-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Import verified Android project')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: apk-build-fix
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part-00 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/part-03 \
            .bootstrap/part-04 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            .bootstrap/part-07 \
            .bootstrap/part-08 \
            .bootstrap/part-09 \
            .bootstrap/part-09b \
            .bootstrap/part-10 \
            | base64 --decode > "$RUNNER_TEMP/streetready.zip"
          mkdir -p "$RUNNER_TEMP/streetready"
          unzip -q "$RUNNER_TEMP/streetready.zip" -d "$RUNNER_TEMP/streetready" || true
          SOURCE="$RUNNER_TEMP/streetready/StreetReady-NRP-Android-v3"
          test -f "$SOURCE/settings.gradle.kts"
          test -f "$SOURCE/build.gradle.kts"
          test -f "$SOURCE/app/build.gradle.kts"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"
          test -f "$SOURCE/app/src/main/java/com/streetready/nrp/MainActivity.kt"
          echo "SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

      - name: Restore and verify curriculum asset
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/course-b64-00 \
            .bootstrap/course-b64-01 \
            .bootstrap/course-b64-02 \
            .bootstrap/course-b64-03 \
            .bootstrap/course-b64-04 \
            .bootstrap/course-b64-05 \
            .bootstrap/course-b64-06 \
            .bootstrap/course-b64-07 \
            .bootstrap/course-b64-08 \
            .bootstrap/course-b64-09 \
            .bootstrap/course-b64-10 \
            > "$RUNNER_TEMP/course.b64"
          echo "192b9efd469ee1f7e770c4fff6f69aa9afe5707a1ee603fa3de6518a9fa2d446  $RUNNER_TEMP/course.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/course.b64" > "$RUNNER_TEMP/course.json.xz"
          echo "9a51cd4a36576fc095f34f6006c21fca518033bd9cf1e5279be9b942d1cea38c  $RUNNER_TEMP/course.json.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/course.json.xz" > "$SOURCE_DIR/app/src/main/assets/course.json"
          echo "b05ea0496379762d7de0502b44ff924d2ea89c259211cba2eeaef7e039b81ec8  $SOURCE_DIR/app/src/main/assets/course.json" | sha256sum -c -
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          course_path = Path(os.environ["SOURCE_DIR"]) / "app/src/main/assets/course.json"
          course = json.loads(course_path.read_text(encoding="utf-8"))
          expected = {"chapters": 53, "lessonCards": 636, "questions": 424, "cases": 40, "ecgs": 48}
          actual = {key: len(course[key]) for key in expected}
          if actual != expected:
              raise SystemExit(f"Curriculum integrity mismatch: {actual} != {expected}")
          print("Curriculum integrity verified:", actual)
          PY

      - name: Repair PracticeScreen syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path(os.environ["SOURCE_DIR"])
          main = source / "app/src/main/java/com/streetready/nrp/MainActivity.kt"
          lines = main.read_text(encoding="utf-8").splitlines()
          if len(lines) < 282 or lines[281].strip() != "} else {":
              raise SystemExit("Expected PracticeScreen else branch was not found at recovered line 282")
          if not lines[280].rstrip().endswith("}}}}}"):
              raise SystemExit("Expected excess closing brace was not found at recovered line 281")
          lines[280] = lines[280].rstrip()[:-1]
          main.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("PracticeScreen syntax repaired")
          PY

      - name: Generate standard Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetReady-NRP-v3-debug-apk
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Import verified project source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/workflows/' "$SOURCE_DIR/" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Import verified Android project"
          git push origin HEAD:apk-build-fix
